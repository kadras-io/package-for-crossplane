#! Crossplane deploys the providers and functions with the `default` DeploymentRuntimeConfig, unless they reference
#! another one. Crossplane creates it if missing, without a seccomp profile and without dropping the capabilities,
#! so the Pods wouldn't comply with the "restricted" Pod Security Standard enforced on the package namespace.
#! The package creates it instead, keeping the upstream defaults (non-root user 2000, no privilege escalation).
#! It's adopted if it already exists, and kept on uninstall, since the providers reference it.
#! See: https://docs.crossplane.io/latest/packages/providers/#runtime-configuration

---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: default
  annotations:
    kapp.k14s.io/create-strategy: fallback-on-update
    kapp.k14s.io/delete-strategy: orphan
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: package-runtime
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              allowPrivilegeEscalation: false
              privileged: false
              capabilities:
                drop:
                - ALL
