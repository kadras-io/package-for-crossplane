#@ load("/lib/validation.star", "is_dns_label")

#@data/values-schema
---

#@schema/desc "The namespace in which to deploy Crossplane. Crossplane also deploys the providers and functions there."
#@schema/validation ("a valid DNS label", is_dns_label)
namespace: crossplane-system

#! =============================================
#! Components
#! =============================================

#@schema/desc "Settings for the Crossplane core, which runs the package manager, the composition engine, and the webhooks."
crossplane:
  #@schema/desc "Container flags, merged on top of the ones computed by the package, which enable all the alpha features. Set a flag to null to remove it. See https://docs.crossplane.io/latest/get-started/install/#feature-flags."
  #@schema/examples ("Vertical scaling", {"max-concurrent-reconciles": 200, "poll-interval": "5m"}), ("Disable an alpha feature", {"enable-provider-deletion-protection": None})
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the RBAC manager, which grants Crossplane and the providers the permissions on the resources they reconcile."
rbac_manager:
  #@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it."
  #@schema/examples ("Vertical scaling", {"max-concurrent-reconciles": 20})
  #@schema/type any=True
  args: {}

#@schema/desc "Settings for the Crossplane providers."
providers:
  #@schema/desc "The activations of the default ManagedResourceActivationPolicy, created at startup: the managed resource kinds of the providers to activate, as patterns like `*.aws.m.upbound.io`. Activate only the ones you use to reduce the CustomResourceDefinitions in the cluster, or set no activation to manage the policies yourself."
  #@schema/default ["*"]
  default_activations:
  #@schema/validation min_len=1
  - ""

#@schema/desc "The composition functions installed with the package. See docs/packages.md."
functions:
  #@schema/desc "Settings for function-auto-ready, which detects the composed resources that are ready, so that the composite resource becomes ready when all of them are."
  auto_ready:
    #@schema/desc "Whether to install the function."
    enabled: false
  #@schema/desc "Settings for function-cel-filter, which filters the composed resources with CEL expressions."
  cel_filter:
    #@schema/desc "Whether to install the function."
    enabled: false
  #@schema/desc "Settings for function-extra-resources, which selects existing resources from the cluster for the next functions of the pipeline."
  extra_resources:
    #@schema/desc "Whether to install the function."
    enabled: false
  #@schema/desc "Settings for function-kcl, which composes resources with KCL."
  kcl:
    #@schema/desc "Whether to install the function."
    enabled: true
  #@schema/desc "Settings for function-kro, which composes resources with kro ResourceGraphDefinitions."
  kro:
    #@schema/desc "Whether to install the function."
    enabled: true
  #@schema/desc "Settings for function-patch-and-transform, which composes resources with patches and transforms."
  patch_and_transform:
    #@schema/desc "Whether to install the function."
    enabled: true
  #@schema/desc "Settings for function-pythonic, which composes resources with Python."
  pythonic:
    #@schema/desc "Whether to install the function."
    enabled: true
  #@schema/desc "Settings for function-sequencer, which delays the creation of composed resources until other ones are ready."
  sequencer:
    #@schema/desc "Whether to install the function."
    enabled: false
  #@schema/desc "Settings for function-shell, which runs shell commands and writes their output to fields of the composite resource."
  shell:
    #@schema/desc "Whether to install the function."
    enabled: false
  #@schema/desc "Settings for function-status-transformer, which sets status conditions on the composite resource by matching the ones of the composed resources."
  status_transformer:
    #@schema/desc "Whether to install the function."
    enabled: false

#! =============================================
#! Trust
#! =============================================

#@schema/desc "PEM-encoded certificates of additional certificate authorities to trust when pulling packages, for example from a private OCI registry. The system ones are still trusted."
ca_cert_data: ""

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs and metrics."
observability:
  logging:
    #@schema/desc "The log level of the controllers."
    #@schema/validation one_of=["info", "debug"]
    level: info
  metrics:
    #@schema/desc "Whether to annotate the Pods for Prometheus scraping. The controllers always expose metrics on port 8080 (`/metrics`)."
    enabled: true

#! =============================================
#! Proxy
#! =============================================

#@schema/desc "Settings for the corporate proxy, used to pull packages from OCI registries."
proxy:
  #@schema/desc "The HTTP proxy to use for network traffic."
  http_proxy: ""
  #@schema/desc "The HTTPS proxy to use for network traffic."
  https_proxy: ""
  #@schema/desc "A comma-separated list of hostnames, IP addresses, or IP ranges in CIDR format that should not use the proxy. Include the in-cluster domains, since Crossplane calls the functions over the cluster network."
  #@schema/examples ("Bypass the proxy for in-cluster traffic", ".cluster.local.,.cluster.local,.svc,10.0.0.0/8")
  no_proxy: ""
