#! The permissions on the composite resources, added to the Kubernetes default roles via aggregation, so that the users
#! bound to `admin`, `edit`, or `view` in a namespace can use the namespaced composite resources there. `view` is included
#! in `edit`, and `edit` in `admin`.
#! See: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles
#!
#! The Crossplane RBAC manager creates the roles for the composite resources of each CompositeResourceDefinition,
#! labelled for the Crossplane roles. These roles aggregate the ones with the `ns-*` labels, which only the roles of the
#! composite resources have: the roles of the managed resources of the providers, and the base Crossplane roles,
#! with the permissions on the cluster-scoped Crossplane resources, aren't included.
#! The rules are filled in by the Kubernetes aggregation controller.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-composite-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.crossplane.io/aggregate-to-ns-edit: "true"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-composite-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.crossplane.io/aggregate-to-ns-view: "true"
