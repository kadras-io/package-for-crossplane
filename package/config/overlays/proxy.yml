#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/crossplane.star", "container", "core")

#! The Crossplane core pulls the packages from OCI registries. The providers and functions run in their own Pods,
#! configured via DeploymentRuntimeConfigs, so they don't get these settings.

#@ proxy = data.values.proxy
#@ env = [{"name": name, "value": value} for name, value in [("HTTP_PROXY", proxy.http_proxy), ("HTTPS_PROXY", proxy.https_proxy), ("NO_PROXY", proxy.no_proxy)] if value]

#@ if env:
#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":core.deployment}})
---
spec:
  template:
    spec:
      containers:
        #@overlay/match by="name"
        - name: #@ container
          env:
          #@ for var in env:
          - #@ var
          #@ end
#@ end
