---
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-values
  namespace: tests
stringData:
  values.yaml: |
    namespace: platform
    providers:
      default_activations:
      - "*.kubernetes.m.crossplane.io"
    functions:
      kcl:
        enabled: false
      kro:
        enabled: false
      pythonic:
        enabled: false
      auto_ready:
        enabled: true
      cel_filter:
        enabled: true
      extra_resources:
        enabled: true
      sequencer:
        enabled: true
      shell:
        enabled: true
      status_transformer:
        enabled: true
    observability:
      logging:
        level: debug
