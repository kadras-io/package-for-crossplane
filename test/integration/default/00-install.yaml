---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Crossplane and its functions are pulled and started, which takes longer than the default timeout on a new cluster.
  - timeout: 600
    script: |
      cd ../../../package && \
      kubectl config set-context --current --namespace=tests && \
      ytt -f ../test/integration/default/config -f package-resources.yml | kctrl dev -f- --local -y
