---
# The Crossplane core and the RBAC manager are ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane
  namespace: crossplane-system
status:
  readyReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-rbac-manager
  namespace: crossplane-system
status:
  readyReplicas: 1
---
# The functions are installed, and their Pods comply with the "restricted" Pod Security Standard enforced on the namespace.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
status:
  conditions:
  - type: Healthy
    status: "True"
  - type: Installed
    status: "True"
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kcl
status:
  conditions:
  - type: Healthy
    status: "True"
  - type: Installed
    status: "True"
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kro
status:
  conditions:
  - type: Healthy
    status: "True"
  - type: Installed
    status: "True"
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-pythonic
status:
  conditions:
  - type: Healthy
    status: "True"
  - type: Installed
    status: "True"
---
# The default ManagedResourceActivationPolicy activates all the managed resources.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: default
spec:
  activate:
  - "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: crossplane-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
