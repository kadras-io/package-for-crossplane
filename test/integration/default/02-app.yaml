---
# Crossplane composes the Deployment and the Service of the App, via function-patch-and-transform,
# and reports the App as ready once the Deployment is available.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      kubectl apply -n "$NAMESPACE" -f - <<EOF
      apiVersion: example.kadras.io/v1alpha1
      kind: App
      metadata:
        name: podinfo
      spec:
        image: ghcr.io/stefanprodan/podinfo:6.17.0
      EOF
  - script: kubectl wait -n "$NAMESPACE" --for=condition=Ready app.example.kadras.io/podinfo --timeout=150s
---
# Users with the `edit` and `view` roles in the namespace, to check the permissions on the composite resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: viewer
