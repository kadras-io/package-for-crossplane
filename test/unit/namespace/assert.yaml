apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane
  namespace: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-rbac-manager
  namespace: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane
  namespace: platform
---
apiVersion: v1
kind: Service
metadata:
  name: crossplane-webhooks
  namespace: platform
---
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-tls-server
  namespace: platform
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane
subjects:
- kind: ServiceAccount
  name: crossplane
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-rbac-manager
(subjects[?namespace != 'platform'] | length(@)): 0
