# The Crossplane core runs with all the alpha features, hardened for the "restricted" Pod Security Standard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: crossplane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      (volumes[?name == 'kube-api-access'] | [0].projected.sources[0].serviceAccountToken.expirationSeconds): 3607
      (volumes[?name == 'ca-certs'] | length(@)): 0
      (initContainers[?name == 'crossplane-init'] | [0]):
        args: [core, init, --activation, "*"]
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        (volumeMounts[?name == 'kube-api-access'] | [0].mountPath): /var/run/secrets/kubernetes.io/serviceaccount
      (containers[?name == 'crossplane'] | [0]):
        (starts_with(image, 'xpkg.crossplane.io/crossplane/crossplane:v')): true
        args:
        - core
        - start
        - --enable-dependency-version-upgrades
        - --enable-dependency-version-downgrades
        - --enable-signature-verification
        - --enable-function-response-cache
        - --enable-operations
        - --enable-pipeline-inspector
        - --enable-provider-deletion-protection
        (env[?name == 'HTTPS_PROXY'] | length(@)): 0
        (env[?name == 'CA_BUNDLE_PATH'] | length(@)): 0
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        (volumeMounts[?name == 'kube-api-access'] | [0].mountPath): /var/run/secrets/kubernetes.io/serviceaccount
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-rbac-manager
  namespace: crossplane-system
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: rbac-manager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      (initContainers[?name == 'crossplane-init'] | [0]):
        args: [rbac, init]
        (volumeMounts[?name == 'kube-api-access'] | length(@)): 1
      (containers[?name == 'crossplane'] | [0]):
        args: [rbac, start, --provider-clusterrole=crossplane:allowed-provider-permissions]
        securityContext:
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        (volumeMounts[?name == 'kube-api-access'] | length(@)): 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane
  namespace: crossplane-system
automountServiceAccountToken: false
imagePullSecrets:
- name: canonical-registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbac-manager
  namespace: crossplane-system
automountServiceAccountToken: false
imagePullSecrets:
- name: canonical-registry-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: crossplane-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
---
# The namespace enforces the "restricted" Pod Security Standard, and is kept on uninstall.
apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
# The CustomResourceDefinitions are kept on uninstall.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: compositeresourcedefinitions.apiextensions.crossplane.io
  annotations:
    kapp.k14s.io/delete-strategy: orphan
    kapp.k14s.io/create-strategy: fallback-on-update
---
# The providers and functions comply with the "restricted" Pod Security Standard.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: default
  annotations:
    kapp.k14s.io/delete-strategy: orphan
spec:
  deploymentTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          (containers[?name == 'package-runtime'] | [0].securityContext.capabilities.drop): [ALL]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane
subjects:
- kind: ServiceAccount
  name: crossplane
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-rbac-manager
subjects:
- kind: ServiceAccount
  name: rbac-manager
  namespace: crossplane-system
---
# The Group subject is left untouched.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: crossplane:masters
(length(subjects)): 1
---
# The functions are installed after Crossplane, and deleted before it.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    kapp.k14s.io/change-rule.upsert: upsert after upserting crossplane.packages.kadras.io/controllers
    kapp.k14s.io/change-rule.delete: delete before deleting crossplane.packages.kadras.io/controllers
spec:
  (starts_with(package, 'xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v')): true
  packagePullSecrets:
  - name: canonical-registry-credentials
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kcl
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kro
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-pythonic
